apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnd
  namespace: dnd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dnd
  template:
    metadata:
      labels:
        app: dnd
    spec:
      containers:
        - name: dnd
          image: avocatocat/dnd:0.1
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: dnd
  namespace: dnd
spec:
  selector:
    app: dnd
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dnd
  namespace: dnd
  annotations: {}
spec:
  ingressClassName: traefik
  rules:
    - host: "dnd.willamep.tech"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dnd
                port:
                  number: 80
